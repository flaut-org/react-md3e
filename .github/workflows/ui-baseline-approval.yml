name: UI baseline approval

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ui-baseline-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline-approval:
    name: UI baseline approval
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Read-only token, no repository credentials persisted or write permission.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Require human review for baseline changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ui-quality/baseline-approval.mjs
