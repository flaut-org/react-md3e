name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'flaut-org/react-md3e' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.verify.outputs.dependency-cache-key }}
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version-packages
          publish-script: npm run release:ci
          pr-title: 'chore: release react-md3e'
          commit-message: 'chore: release react-md3e'
          create-github-releases: true
          push-git-tags: true
