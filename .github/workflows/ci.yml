name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      dependency-cache-key:
        description: Exact node_modules cache key for downstream jobs
        value: ${{ jobs.install.outputs.cache-key }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.dependencies.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Restore node_modules
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', '.npmrc', 'package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save node_modules
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  build:
    name: Build package
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      # Public imports, declarations and generated themes are required by the checks below.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: package-build
          path: |
            packages/react-md3e/dist/
            packages/react-md3e/src/theme/default-theme.generated.json
            stories/*.generated.json
            apps/next-fixture/app/**/*.generated.css
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  validate:
    name: ${{ matrix.name }}
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Prettier
            command: npm run format:check
          - name: Package validation
            command: npm run check:package
          - name: UI contract
            command: npm run check:ui-contract
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - run: ${{ matrix.command }}

  unit:
    name: Unit tests
    needs: [install, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - run: npm run test:unit
      - run: npm run test:release

  build-apps:
    name: Build ${{ matrix.target }}
    needs: [install, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [fixture, 'fixture:webpack', webpack-subpaths, storybook, vite-fixture]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - run: npm run build:${{ matrix.target }}
      # Tar preserves hidden .next files, links and permissions without transporting its build cache.
      - name: Archive production fixture
        if: startsWith(matrix.target, 'fixture')
        run: tar --exclude='.next/cache' -cf fixture-build.tar -C apps/next-fixture .next
      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.target, 'fixture')
        with:
          name: ${{ matrix.target == 'fixture' && 'fixture-build' || 'fixture-webpack-build' }}
          path: fixture-build.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'vite-fixture'
        with:
          name: vite-fixture-build
          path: packages/react-md3e/tests/vite-consumer/dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'storybook'
        with:
          name: storybook-build
          path: storybook-static/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  integration:
    name: HTTP integration (${{ matrix.bundler }})
    needs: [install, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bundler: [turbopack, webpack]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.bundler == 'turbopack' && 'fixture-build' || 'fixture-webpack-build' }}
      - run: tar -xf fixture-build.tar -C apps/next-fixture
      - run: npm run test:http

  playwright:
    name: Playwright ${{ matrix.bundler }} shard ${{ matrix.shard }}
    needs: [install, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        bundler: [turbopack, webpack]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.bundler == 'turbopack' && 'fixture-build' || 'fixture-webpack-build' }}
      - run: tar -xf fixture-build.tar -C apps/next-fixture
      - uses: actions/download-artifact@v7
        with:
          name: storybook-build
          path: storybook-static
      - uses: actions/download-artifact@v7
        with:
          name: vite-fixture-build
          path: packages/react-md3e/tests/vite-consumer/dist
      - name: Install Chromium and system dependencies
        run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - name: Upload browser diagnostics and specification coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.bundler }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  ui-quality:
    name: UI visual and interaction checks
    needs: [install, build-apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Install in the canonical Noble image; do not reuse host-OS native modules.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: package-build
      - uses: actions/download-artifact@v7
        with:
          name: storybook-build
          path: storybook-static
      - run: npm run test:ui
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-quality-${{ github.run_attempt }}
          path: |
            test-results/ui/
            playwright-report/ui/
          if-no-files-found: warn
          retention-days: 14

  ui-quality-gate:
    name: UI Quality Gate
    needs: ui-quality
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require UI evidence checks to succeed
        env:
          UI_RESULT: ${{ needs.ui-quality.result }}
        run: test "$UI_RESULT" = success

  check:
    needs: [install, build, validate, unit, build-apps, integration, playwright, ui-quality-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
