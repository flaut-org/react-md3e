name: Extended UI quality

on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 1'
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ui-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended:
    name: Cross-browser motion and touch
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-extended')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run build:storybook
      - run: npm run test:ui:extended
      - run: npm run test:ui:mutations
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-extended-${{ github.run_attempt }}
          path: |
            test-results/ui-extended/
            test-results/ui-mutations/
            playwright-report/ui-extended/
          if-no-files-found: warn
          retention-days: 14
